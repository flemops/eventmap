<!doctype html>
<html lang="%%LANG%%" dir="%%DIR%%">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="%%DESC%%">
<title>%%TITLE%%</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2312131f'/%3E%3Cpath d='M16 6c-3.9 0-7 3.1-7 7 0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5a2.5 2.5 0 110-5 2.5 2.5 0 010 5z' fill='%23ef3d6e'/%3E%3C/svg%3E">
<link rel="canonical" href="%%CANON%%">
%%ALTERNATES%%
<meta property="og:type" content="website">
<meta property="og:site_name" content="EventMap">
<meta property="og:locale" content="%%OGLOCALE%%">
<meta property="og:url" content="%%CANON%%">
<meta property="og:title" content="%%TITLE%%">
<meta property="og:description" content="%%DESC%%">
<meta name="twitter:card" content="summary">
<!-- Balisage schema.org rendu côté serveur : le WebSite/WebPage et, pour les villes dont
     les événements ont leur propre fiche (/{ville}/e/{id}), les Event de ce soir. Un
     type="application/ld+json" n'est pas un script exécutable : il échappe à la CSP. -->
<script type="application/ld+json">%%JSONLD%%</script>
<script type="application/json" id="em-city">%%CITYJSON%%</script>
<link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin>
<link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/static/vendor/markercluster/MarkerCluster.css">
<link rel="stylesheet" href="/static/vendor/markercluster/MarkerCluster.Default.css">
<link rel="stylesheet" href="/static/common.css?v=%%V%%">
<link rel="stylesheet" href="/static/city.css?v=%%V%%">
</head>
<body class="carte-page">

<header class="top">
  <div class="bar">
    <a class="brand" href="%%HOME_URL%%" id="brand">EventMap</a>
    <div class="switchers">
      <nav id="lang-links" class="langs" aria-label="Language"></nav>
    </div>
  </div>
  %%CITY_SWITCH%%
  <h1 id="h1">%%H1%% <span class="count" id="count" aria-live="polite"></span></h1>
  <div class="row" id="when" role="group" aria-label="When">
    <button class="chip" type="button" data-when="today" aria-pressed="true"></button>
    <button class="chip" type="button" data-when="tomorrow" aria-pressed="false"></button>
    <button class="chip" type="button" data-when="weekend" aria-pressed="false"></button>
    <button class="chip" type="button" data-when="week" aria-pressed="false"></button>
  </div>
  <div class="row" id="filters">
    <button class="chip" type="button" id="geo"></button>
    <button class="chip" type="button" id="free" aria-pressed="false"></button>
    <select class="chip" id="radius" aria-label="Distance"></select>
    <select class="chip" id="category" aria-label="Categories"></select>
  </div>
  <div id="notice" class="notice" role="status" hidden></div>
  <div id="suggest" class="notice info" role="status" hidden></div>
</header>

<main>
  <div id="map" role="region" aria-label="Map"></div>
  <section class="sheet" id="sheet" data-state="half" aria-label="Events">
    <button class="grab" id="grab" type="button" aria-expanded="true" aria-controls="panel"><span class="bar-grip" aria-hidden="true"></span></button>
    <div class="panel" id="panel">
      <h2 class="sr" id="list-title"></h2>
      <div id="status" class="status" aria-live="polite"></div>
      <div id="list" class="list"><div class="seo" id="seo">
        <p class="sr">%%SEO_NOSCRIPT%%</p>
        %%SEO_EVENTS%%
      </div></div>
      <article id="detail" class="detail" hidden></article>
    </div>
  </section>
</main>

<footer id="foot">%%FOOTER%%</footer>

<script src="/static/vendor/leaflet/leaflet.js"></script>
<script src="/static/vendor/markercluster/leaflet.markercluster.js"></script>
<script src="/static/i18n.js?v=%%V%%"></script>
<script src="/static/common.js?v=%%V%%"></script>
<script src="/static/cityswitch.js?v=%%V%%" defer></script>
<script src="/static/app.js?v=%%V%%"></script>
</body>
</html>
