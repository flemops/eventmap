<!doctype html>
<html lang="%%LANG%%" dir="%%DIR%%">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="%%DESC%%">
<title>%%TITLE%%</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2312131f'/%3E%3Cpath d='M16 6c-3.9 0-7 3.1-7 7 0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5a2.5 2.5 0 110-5 2.5 2.5 0 010 5z' fill='%23ef3d6e'/%3E%3C/svg%3E">
<link rel="canonical" href="%%CANON%%">
%%ALTERNATES%%
<meta property="og:type" content="website">
<meta property="og:site_name" content="EventMap">
<meta property="og:locale" content="%%OGLOCALE%%">
<meta property="og:url" content="%%CANON%%">
<meta property="og:title" content="%%TITLE%%">
<meta property="og:description" content="%%DESC%%">
<meta name="twitter:card" content="summary">
<!-- Balisage schema.org rendu côté serveur : le WebSite/WebPage et, pour les villes dont
     les événements ont leur propre fiche (/{ville}/e/{id}), les Event de ce soir. Un
     type="application/ld+json" n'est pas un script exécutable : il échappe à la CSP. -->
<script type="application/ld+json">%%JSONLD%%</script>
<script type="application/json" id="em-city">%%CITYJSON%%</script>
<link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin>
<link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/static/vendor/markercluster/MarkerCluster.css">
<link rel="stylesheet" href="/static/vendor/markercluster/MarkerCluster.Default.css">
<link rel="stylesheet" href="/static/common.css?v=%%V%%">
<link rel="stylesheet" href="/static/city.css?v=%%V%%">
</head>
<body class="carte-page">

<header class="top">
  <div class="bar">
    <div class="bar-start">
      <a class="brand" href="%%HOME_URL%%" id="brand"><svg viewBox="8 5 16 22" aria-hidden="true" focusable="false"><path fill-rule="evenodd" d="M16 6c-3.9 0-7 3.1-7 7 0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5a2.5 2.5 0 110-5 2.5 2.5 0 010 5z"/></svg><span>EventMap</span></a>
      %%CITY_SWITCH%%
    </div>
    <div class="switchers">
      <button class="saved-btn" type="button" id="saved-btn" hidden><svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M8 13.6S2.2 10 2.2 6a3.2 3.2 0 015.8-1.9A3.2 3.2 0 0113.8 6c0 4-5.8 7.6-5.8 7.6z" fill="currentColor"/></svg><b id="saved-n"></b></button>
      <nav id="lang-links" class="langs" aria-label="Language"></nav>
    </div>
  </div>
  <div class="hero">
    <h1 id="h1">%%H1%%</h1>
    <span class="count" id="count"></span>
  </div>
  <div class="row quick" id="quick" role="group" aria-label="When">
    <button class="chip" type="button" data-when="today" aria-pressed="true"></button>
    <button class="chip" type="button" data-when="weekend" aria-pressed="false"></button>
    <button class="chip" type="button" id="free" aria-pressed="false"></button>
    <button class="chip chip-filters" type="button" id="open-filters" aria-haspopup="dialog" aria-expanded="false" aria-controls="filters-panel"><svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M2 4h7M13 4h1M2 12h1M7 12h7M9 2.5v3M5 10.5v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg><span id="filters-label"></span><b class="fn" id="filters-n" hidden></b></button>
  </div>
</header>

<main>
  <div id="map" role="region" aria-label="Map"></div>
  <section class="sheet" id="sheet" data-state="half" aria-label="Events">
    <button class="grab" id="grab" type="button" aria-expanded="true" aria-controls="panel"><span class="bar-grip" aria-hidden="true"></span></button>
    <div id="status" class="status" aria-live="polite"></div>
    <div class="panel" id="panel">
      <h2 class="sr" id="list-title"></h2>
      <div id="notice" class="notice" role="status" hidden></div>
      <div id="suggest" class="notice info" role="status" hidden></div>
      <div id="list" class="list"><div class="seo" id="seo">
        <p class="sr">%%SEO_NOSCRIPT%%</p>
        %%SEO_EVENTS%%
      </div></div>
      <article id="detail" class="detail" hidden></article>
    </div>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div class="scrim" id="scrim" hidden></div>
<section class="fpanel" id="filters-panel" role="dialog" aria-labelledby="fp-title" hidden>
  <div class="fp-head">
    <h2 id="fp-title"></h2>
    <button class="fp-reset" type="button" id="fp-reset"></button>
    <button class="fp-close" type="button" id="fp-close"><svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M3.5 3.5l9 9m0-9l-9 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg></button>
  </div>
  <div class="fp-body">
    <fieldset class="fp-group"><legend id="fp-l-when"></legend><div class="seg" id="fp-when" role="group" aria-labelledby="fp-l-when"></div></fieldset>
    <fieldset class="fp-group"><legend id="fp-l-price"></legend><div class="seg" id="fp-price" role="group" aria-labelledby="fp-l-price"></div></fieldset>
    <fieldset class="fp-group"><legend id="fp-l-cat"></legend><div class="seg wrap" id="fp-cats" role="group" aria-labelledby="fp-l-cat"></div></fieldset>
    <fieldset class="fp-group"><legend id="fp-l-radius"></legend><div class="seg" id="fp-radius" role="group" aria-labelledby="fp-l-radius"></div></fieldset>
  </div>
  <div class="fp-foot"><button class="btn primary" type="button" id="fp-done"></button></div>
</section>

<footer id="foot">%%FOOTER%%</footer>

<script src="/static/vendor/leaflet/leaflet.js"></script>
<script src="/static/vendor/markercluster/leaflet.markercluster.js"></script>
<script src="/static/i18n.js?v=%%V%%"></script>
<script src="/static/common.js?v=%%V%%"></script>
<script src="/static/cityswitch.js?v=%%V%%" defer></script>
<script src="/static/app.js?v=%%V%%"></script>
</body>
</html>
