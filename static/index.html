<style>
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  display: flex; flex-direction: column; -webkit-font-smoothing: antialiased;
}

/* ---- barre de filtres : compacte, tout au pouce --------------------- */
header {
  padding: 10px 12px 8px; background: var(--panel); border-bottom: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 8px; flex: none;
}
.row { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.row::-webkit-scrollbar { display: none; }
.status { font-size: 13px; color: var(--muted); min-height: 1.2em; }
.status strong { color: var(--text); }

/* ---- carte + liste : empilés mobile, côte à côte desktop -------------- */
main { flex: 1; display: flex; flex-direction: column; min-height: 0; }
#map { flex: 0 0 38vh; min-height: 200px; background: var(--panel); }
#list { flex: 1; overflow-y: auto; padding: 10px 12px calc(16px + var(--safe-b)); display: grid; gap: 8px; align-content: start; }
@media (min-width: 900px) {
  main { flex-direction: row; }
  #map { flex: 1 1 55%; height: auto; }
  #list { flex: 0 0 440px; border-left: 1px solid var(--line); }
}

/* ---- carte event : tuile "panneau d'affichage" -------------------------- */
.ev {
  display: grid; grid-template-columns: 58px 1fr; gap: 10px; padding: 10px 12px;
  background: var(--panel); border: 1px solid var(--line); border-left: 3px solid transparent; border-radius: var(--radius);
  text-decoration: none; color: inherit; cursor: pointer;
  transition: border-color .15s ease, background .15s ease;
}
.ev:hover, .ev.active { border-left-color: var(--accent); background: color-mix(in srgb, var(--panel) 92%, var(--accent) 8%); }
.empty { text-align: center; color: var(--muted); padding: 40px 20px; }
.empty b { display: block; color: var(--text); font-size: 18px; margin-bottom: 6px; }

/* ---- Leaflet ------------------------------------------------------------ */
.leaflet-popup-content-wrapper { background: var(--panel); color: var(--text); border-radius: 10px; }
.leaflet-popup-tip { background: var(--panel); }
.leaflet-popup-content a { color: var(--accent); }
.leaflet-container { font: inherit; }
.me { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); border: 3px solid #fff; box-shadow: 0 0 0 2px var(--accent); }
footer { font-size: 11px; color: var(--muted); padding: 6px 12px calc(6px + var(--safe-b)); border-top: 1px solid var(--line); background: var(--panel); }
</style>
</head>
<body>

<header>
  <div class="row" id="when" role="group" aria-label="Quand">
    <button class="chip" data-when="today" aria-pressed="true">Ce soir</button>
    <button class="chip" data-when="tomorrow" aria-pressed="false">Demain</button>
    <button class="chip" data-when="weekend" aria-pressed="false">Week-end</button>
    <button class="chip" data-when="week" aria-pressed="false">7 jours</button>
  </div>
  <div class="row">
    <button class="chip" id="geo" title="Me localiser">📍 Autour de moi</button>
    <select class="chip" id="radius" aria-label="Distance">
      <option value="1">1 km</option><option value="2" selected>2 km</option>
      <option value="4">4 km</option><option value="8">Tout Paris</option>
    </select>
    <select class="chip" id="price" aria-label="Prix">
      <option value="free" selected>Gratuit</option><option value="">Gratuit ou payant</option><option value="paid">Payant</option>
    </select>
    <select class="chip" id="category" aria-label="Catégorie"><option value="">Toutes catégories</option></select>
  </div>
  <div class="status" id="status">Chargement…</div>
</header>

<main>
  <div id="map" role="region" aria-label="Carte des événements"></div>
  <div id="list"></div>
</main>
