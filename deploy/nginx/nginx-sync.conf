# Manifeste lu par nginx-sync.sh — tout ce qui est propre a ce site.
# Le script, lui, est generique et identique dans les trois depots
# (portfolio, eventmap, observatory).

SITE="eventmap"
VERIF_HOST="eventmap.hamdy-tabsissi.com"
SITE_CONF="/etc/nginx/sites-available/eventmap"

# ORDRE D'INSTALLATION : les snippets AVANT le fichier de site qui les inclut.
# Dans l'autre sens, `nginx -t` echoue sur un include manquant.
#
# Deux snippets et non un seul : la CSP ne s'applique pas aux memes locations
# que les cinq autres en-tetes. /health n'en a jamais eu, et ce decoupage
# preserve ce comportement au lieu de le changer en douce.
FICHIERS=(
  "snippets/eventmap-entetes.conf|/etc/nginx/snippets/eventmap-entetes.conf"
  "snippets/eventmap-csp.conf|/etc/nginx/snippets/eventmap-csp.conf"
  "eventmap.conf|$SITE_CONF"
)
