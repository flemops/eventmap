# Configuration nginx du vhost eventmap.
#
# SOURCE DE VÉRITÉ : ce fichier. Ne pas éditer /etc/nginx/sites-available/eventmap
# à la main — la modification serait invisible dans l'historique et perdue au
# déploiement suivant. Modifier ici, commiter, puis sur la VM :
#
#     cd /opt/eventmap && sudo bash deploy/nginx/nginx-sync.sh apply
#
# `nginx-sync.sh check` compare ce fichier à ce qui tourne réellement et signale
# toute dérive, sans rien modifier ni sudo.
#
# Bloc séparé du portfolio : sous-domaine dédié, jamais un sous-chemin.
# Certificat : wildcard *.hamdy-tabsissi.com, partagé avec portfolio/observatory.
#
# PIÈGE NGINX (rencontré et corrigé le 02/09/2026) : un `add_header` dans une
# location REMPLACE silencieusement tous les add_header hérités du bloc
# server — il ne s'ajoute pas à eux. Chaque location posant son propre
# Cache-Control, l'héritage est inutilisable : les en-têtes sont donc inclus
# location par location. L'`include` est une inclusion TEXTUELLE, donc
# l'équivalent exact d'une duplication à la main, sans le risque d'en oublier
# une en ajoutant une location.
#
# Depuis le 05/09/2026 les en-têtes ne sont plus recopiés ici mais dans
# snippets/eventmap-entetes.conf (5 en-têtes, 3 locations) et
# snippets/eventmap-csp.conf (la CSP, 2 locations — `= /health` n'en a jamais
# eu et n'en a toujours pas).

limit_req_zone $binary_remote_addr zone=eventmap_api:1m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name eventmap.hamdy-tabsissi.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name eventmap.hamdy-tabsissi.com;

    ssl_certificate     /etc/nginx/ssl/hamdy-tabsissi.com.pem;
    ssl_certificate_key /etc/nginx/ssl/hamdy-tabsissi.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    location /api/ {
        limit_req zone=eventmap_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        include /etc/nginx/snippets/eventmap-entetes.conf;
        include /etc/nginx/snippets/eventmap-csp.conf;
        add_header Cache-Control "public, max-age=120";
    }

    # Déclenchement manuel du refresh : réservé au localhost, jamais exposé.
    #
    # Pas d'include ici, et ce n'est pas un oubli de l'extraction du 05/09/2026 :
    # ce 403 n'a jamais porté d'en-tête. Le corps est la page d'erreur statique
    # de nginx, sans contenu contrôlable par un tiers — le risque est nul. Ne
    # pas copier ce bloc comme modèle pour une nouvelle location : toute
    # location qui sert du contenu doit inclure les deux snippets.
    location /api/refresh {
        deny all;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000;
        access_log off;
        include /etc/nginx/snippets/eventmap-entetes.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        include /etc/nginx/snippets/eventmap-entetes.conf;
        include /etc/nginx/snippets/eventmap-csp.conf;
        add_header Cache-Control "public, max-age=600";
    }
}
