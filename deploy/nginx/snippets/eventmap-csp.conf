# CSP du vhost eventmap — SOURCE DE VERITE UNIQUE.
#
# Separee de eventmap-entetes.conf parce qu'elle ne couvre pas les memes
# locations : /api/ et / la posent, `= /health` non. Les fusionner en un seul
# snippet ajouterait une CSP a /health, qui n'en a jamais eu — un changement
# de comportement, pas une mise sous version.
#
# Les deux ouvertures img-src vers tile.openstreetmap.org sont les tuiles de
# la carte Leaflet : sans elles, la carte est vide. Rien d'autre n'est ouvert,
# script-src reste 'self'.
#
# Avant le 05/09/2026 cette directive etait recopiee a l'identique dans les
# deux locations concernees. Elle n'existe plus qu'ici.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org https://*.tile.openstreetmap.org; connect-src 'self'; base-uri 'none'; form-action 'self'" always;
