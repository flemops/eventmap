# En-tetes de securite communs aux locations du vhost eventmap.
#
# POURQUOI UN `include` ET PAS L'HERITAGE : un `add_header` place dans une
# location REMPLACE silencieusement tous les add_header herites du bloc server
# (piege rencontre et corrige le 02/09/2026) — il ne s'y ajoute pas. Comme
# chaque location d'eventmap pose son propre Cache-Control, l'heritage est
# inutilisable. Un `include` est une inclusion TEXTUELLE : chaque location
# recoit reellement sa propre copie des directives, ce qui donne le meme
# resultat qu'une duplication a la main, sans le risque d'en oublier une en
# ajoutant une location.
#
# Avant le 05/09/2026 ces cinq lignes etaient recopiees dans les trois
# locations. Elles n'existent plus qu'ici.
#
# La CSP n'est PAS dans ce fichier : elle ne couvre pas les memes locations.
# Voir eventmap-csp.conf.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
