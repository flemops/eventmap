# /etc/nginx/sites-available/eventmap
#
# Bloc séparé du portfolio : sous-domaine dédié, jamais un sous-chemin.
# Certificat : wildcard *.hamdy-tabsissi.com, partagé avec portfolio/observatory.
#
# PIÈGE NGINX (rencontré et corrigé le 02/09/2026) : un `add_header` dans une
# location REMPLACE silencieusement tous les add_header hérités du bloc
# server — il ne s'ajoute pas à eux. D'où la duplication des 6 en-têtes de
# sécurité dans chaque location qui pose son propre Cache-Control.

limit_req_zone $binary_remote_addr zone=eventmap_api:1m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name eventmap.hamdy-tabsissi.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name eventmap.hamdy-tabsissi.com;

    ssl_certificate     /etc/nginx/ssl/hamdy-tabsissi.com.pem;
    ssl_certificate_key /etc/nginx/ssl/hamdy-tabsissi.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    location /api/ {
        limit_req zone=eventmap_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.tile.openstreetmap.org; connect-src 'self'; base-uri 'none'; form-action 'self'" always;
        add_header Cache-Control "public, max-age=120";
    }

    # Déclenchement manuel du refresh : réservé au localhost, jamais exposé.
    location /api/refresh {
        deny all;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000;
        access_log off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.tile.openstreetmap.org; connect-src 'self'; base-uri 'none'; form-action 'self'" always;
        add_header Cache-Control "public, max-age=600";
    }
}
