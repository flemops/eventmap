# /etc/nginx/sites-available/eventmap
#
# Bloc séparé du portfolio : sous-domaine dédié, jamais un sous-chemin.
# Remplacer `eventmap.example.fr` par le vrai sous-domaine ; certbot --nginx
# ajoutera le bloc 443 une fois le DNS pointé.

# Limite par IP : 10 req/s, rafale de 20. Protège l'API d'un script qui boucle
# sans gêner un humain qui zoome sur la carte.
limit_req_zone $binary_remote_addr zone=eventmap_api:1m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name eventmap.example.fr;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # L'appli ne fait pas de cache HTTP elle-même : nginx le fait pour elle.
    location /api/ {
        limit_req zone=eventmap_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        add_header Cache-Control "public, max-age=120";
    }

    # Déclenchement manuel du refresh : réservé au localhost, jamais exposé.
    location /api/refresh {
        deny all;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=600";
    }
}
