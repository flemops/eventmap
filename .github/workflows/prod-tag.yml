name: Validation + tag prod

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      tag_prod:
        description: "Déplacer le tag prod si la validation passe"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  ci:
    uses: flemops/ci-templates/.github/workflows/valider-et-taguer.yml@master
    with:
      runtime: python
      version: "3.10"
      install_cmd: pip install -r requirements.txt
      # "pytest" nu ne met pas la racine du dépôt sur sys.path (pas de
      # pyproject.toml/pytest.ini ici) : tests/test_core.py qui importe
      # `cultures`/`db`/`main` échouerait en ModuleNotFoundError. "python -m
      # pytest" l'ajoute (CWD en sys.path[0]).
      test_cmd: python -m pytest
      # == true, pas juste inputs.tag_prod : sur un déclenchement push (pas
      # workflow_dispatch), inputs.tag_prod vaut null, pas false — un null
      # passé à un paramètre booléen du reusable workflow invalide tout le
      # fichier (0 job créé, "workflow file issue").
      tag_prod: ${{ inputs.tag_prod == true }}
