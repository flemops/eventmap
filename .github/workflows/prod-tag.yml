name: Validation + tag prod

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      tag_prod:
        description: "Déplacer le tag prod si la validation passe"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  ci:
    # Épinglé sur un commit de ci-templates (pas @master) : un changement du gabarit ne peut plus
    # modifier silencieusement ce qui autorise le déploiement. Dépôt privé donc invisible de
    # Dependabot : le SHA se met à jour à la main, après relecture du diff du gabarit (docs/release.md).
    uses: flemops/ci-templates/.github/workflows/valider-et-taguer.yml@4a48712a9e096bbcdbad47669d5b0ef5efe3aa4c  # master au 06/10/2026
    with:
      runtime: python
      # Version de la VM (migrée en 3.12.15 le 07/10/2026) : le tag `prod` ne se déplace que si les tests
      # passent sur le runtime réellement déployé (docs/python-runtime.md).
      version: "3.12"
      install_cmd: pip install -r requirements-dev.txt
      lint_cmd: ruff check .
      test_cmd: pytest --cov --cov-fail-under=78
      # Filet : les dépendances de PRODUCTION seules doivent suffire à importer l'application.
      prod_install_cmd: pip install -r requirements.txt
      prod_check_cmd: python deploy/check_imports.py
      # == true, pas juste inputs.tag_prod : sur un déclenchement push (pas
      # workflow_dispatch), inputs.tag_prod vaut null, pas false — un null
      # passé à un paramètre booléen du reusable workflow invalide tout le
      # fichier (0 job créé, "workflow file issue").
      tag_prod: ${{ inputs.tag_prod == true }}

  post-deploy:
    # Enchaîné ici plutôt que par `workflow_run` (qui ne s'est pas déclenché de façon fiable) :
    # seulement si le tag `prod` vient réellement de bouger.
    needs: ci
    if: github.event_name == 'push' || inputs.tag_prod == true
    uses: ./.github/workflows/post-deploy.yml
    permissions:
      contents: read
