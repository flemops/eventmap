name: CI (quality gate)

# Porte de qualité d'une PR : installation propre → lint → tests + couverture → audit des dépendances
# → secrets → validation des configs. `prod-tag.yml` (sur master) rejoue lint + tests avant de déplacer
# le tag `prod` : un commit n'est déployé que s'il passe aussi cette porte.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: Lint + tests + couverture (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Installation (dépendances de dev, épinglées)
        run: pip install -r requirements-dev.txt
      - name: Ruff (lint + tri des imports)
        run: ruff check .
      - name: Tests + couverture (plancher non régressif, voir pyproject.toml)
        run: pytest --cov --cov-report=term --cov-report=xml --cov-fail-under=78
      - name: Les dépendances de production seules suffisent (venv vierge)
        run: |
          python -m venv /tmp/prod-only
          /tmp/prod-only/bin/pip install -q -r requirements.txt
          /tmp/prod-only/bin/python deploy/check_imports.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  compat:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]   # 3.10 = VM aujourd'hui ; 3.13 = prochaine cible possible
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  audit:
    name: Audit des dépendances + SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install pip-audit==2.10.1
      # Politique : une vulnérabilité CONNUE dans une dépendance d'exécution fait échouer la PR.
      # Un faux positif sans correctif se tolère explicitement avec --ignore-vuln <ID> + justification
      # ici même (jamais en désactivant l'étape). L'index PyPI est lu en ligne : un incident réseau
      # ponctuel se relance, il ne s'ignore pas.
      - name: pip-audit (requirements.txt)
        run: pip-audit --requirement requirements.txt --strict
      - name: SBOM CycloneDX (inventaire des dépendances d'exécution)
        run: pip-audit --requirement requirements.txt --format cyclonedx-json --output sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 30

  secrets:
    name: Détection de secrets (historique complet)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
