# Une PR groupée par écosystème et par mois : pas de bruit quotidien.
# Les versions de requirements*.txt sont épinglées en == (voir l'en-tête de requirements.txt :
# le rollback réinstalle exactement ces versions) — Dependabot propose le nouvel épinglage.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    groups:
      python-deps:
        patterns: ["*"]
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
    ignore:
      # Dépôt privé : Dependabot n'y a pas accès (« Repository not found », la mise à jour échoue
      # entièrement). Le SHA de ci-templates dans prod-tag.yml se met à jour À LA MAIN : relire le
      # diff du gabarit puis changer le SHA (docs/release.md).
      - dependency-name: "flemops/ci-templates"
    open-pull-requests-limit: 3
