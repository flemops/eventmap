# Une PR groupée par mois pour les dépendances Python et les GitHub Actions.
# Les versions de requirements*.txt restent épinglées en == ; Dependabot propose le nouvel épinglage.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    groups:
      python-deps:
        patterns: ["*"]
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 2
