# Une PR groupée par mois pour les dépendances Python : pas de bruit quotidien.
# Les versions de requirements*.txt sont épinglées en == (voir l'en-tête de requirements.txt :
# le rollback réinstalle exactement ces versions) — Dependabot propose le nouvel épinglage.
#
# Écosystème `github-actions` volontairement ABSENT : le workflow réutilisable `flemops/ci-templates`
# (dépôt privé) est invisible de Dependabot, et son job échoue entièrement (« Repository not found »)
# même avec `ignore:` (constaté le 06/10/2026). Les actions sont épinglées sur des SHA (test
# `test_toute_action_tierce_est_epinglee_sur_un_sha`) et se mettent à jour à la main, par revue
# trimestrielle. Réactiver ici dès que Dependabot a accès à ci-templates (réglage de ce dépôt
# privé) ou que le dépôt devient public : décision D19, docs/release.md.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    groups:
      python-deps:
        patterns: ["*"]
    open-pull-requests-limit: 3
