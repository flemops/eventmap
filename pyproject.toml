[project]
name = "eventmap"
version = "0.0.0"          # application déployée par git (tag `prod`), pas publiée sur PyPI
description = "Agrégateur d'événements multi-ville : une proposition, au bon moment, déjà filtrée."
requires-python = ">=3.10"
# Les dépendances d'exécution vivent dans requirements.txt (épinglées en ==, voir son en-tête :
# le déploiement ET le rollback font `pip install -r requirements.txt`). Outils : requirements-dev.txt.

[tool.pytest.ini_options]
pythonpath = ["."]          # `pytest` nu fonctionne (avant : seul `python -m pytest` mettait la racine sur sys.path)
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "deploy/*", ".venv/*"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# fail_under : voir .github/workflows/ci.yml (plancher non régressif fondé sur la mesure de référence)

[tool.ruff]
target-version = "py310"
extend-exclude = [".venv", "venues"]

[tool.ruff.lint]
# Jeu volontairement court : vrais défauts (E/F/B), imports triés (I), syntaxe modernisable (UP).
# Pas d'E501 (longueur de ligne) ni de `ruff format` : le dépôt tient volontairement des colonnes
# alignées et des lignes denses ; reformater 25 fichiers sur 30 noierait l'historique sans gain.
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["B905", "E731"]   # zip sans strict= et lambdas nommées : style assumé, aucun bug en jeu
