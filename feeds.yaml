    note: >
      Drupal. JSON-LD présent mais uniquement WebPage/BreadcrumbList, aucun
      Event. Ni .ics ni RSS sur /agenda. Candidat scrape LLM ou demande
      directe à la DSI de la ville (un export iCal est trivial côté Drupal).

  - url: https://openagenda.com/fr/montreuil
