# Annuaire des sources de la couche 2 (flux municipaux, salles, lieux associatifs).
#
# C'EST L'ACTIF DU PROJET : le code se réécrit, cet inventaire non. Chaque
# entrée porte ce qui a été constaté et quand, pour qu'on sache dans six mois
# si un domaine vaut le coup d'être resondé.
#
# Champs :
#   url       : ce que le connecteur charge (ou le domaine sondé si rien trouvé)
#   type      : ics | rss | jsonld | openagenda | llm | none
#   enabled   : false = ignoré par la boucle de refresh
#   license   : licence constatée, ou unknown (à vérifier avant publication)
#   status    : ok | empty | no-feed | dns-error | cert-expired | needs-key
#   checked   : date du dernier sondage
#   note      : ce qu'il faut savoir pour la prochaine personne
#
# Sondage effectué par `python discover.py <domaines>` le 2026-08-23, complété
# à la main pour les chemins propres à TYPO3/Drupal et les RSS WordPress.

feeds:

  # ------------------------------------------------------------- Montreuil

  - url: https://lamarbrerie.fr/feed/
    name: La Marbrerie
    city: Montreuil
    type: rss
    enabled: false
    license: unknown
    status: ok
    checked: 2026-08-23
    note: >
      RSS WordPress, 30 items catégorie « Agenda ». Les dates sont des
      pubDate (publication), pas des dates d'événement : il faudra parser
      la date dans le titre ou la page. Dernier item 30/07 — site entre deux
      saisons au moment du sondage. Pas de .ics malgré WordPress
      (The Events Calendar non installé : /events/?ical=1 → 404).

  - url: https://www.instantschavires.com/feed/
