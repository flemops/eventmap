# Annuaire des sources de la couche 2 (flux municipaux, salles, lieux).
#
# PÉRIMÈTRE : PARIS INTRA-MUROS. QFAP reste la source de base (voir main.py,
# _build_fetchers) ; ce fichier ajoute des flux ICS/OpenAgenda complémentaires.
#
# Champs lus par le code (main.py::_build_fetchers) :
#   url       : ce que le connecteur charge — clé d'upsert dans `feeds`
#   type      : ics | rss | jsonld | openagenda | llm (seuls ics/openagenda
#               sont câblés dans la boucle de refresh)
#   name      : libellé humain, stocké en base
#   enabled   : false = ignoré par la boucle de refresh (défaut : true)
#   geo_bbox  : optionnel — {lat_min, lat_max, lon_min, lon_max}. Un flux qui
#               déborde de son périmètre déclaré (ex. FICEP : quelques
#               entrées à Arles, Bruxelles, Lyon) est filtré à l'ingestion
#               plutôt que d'être cru sur parole.
#
# Champs multi-ville / exploitation (registry.py) :
#   id             : identifiant stable, cité par cities.yaml (`sources:`)
#   city           : ville servie (cities.yaml). Défaut : paris
#   authorization  : ok | pending | refused. Seule `ok` est interrogée —
#                    `enabled: true` ne suffit pas (13.7)
#   priority       : plus haut = plus fiable ; départage deux sources en conflit
#   refresh_hours, timeout_s, retries, min_interval_s : politique d'ingestion
#
# Champs documentaires seulement (ignorés par le code, gardés pour mémoire) :
#   license, status, checked, note, attribution

feeds:
  - id: ficep
    city: paris
    authorization: ok
    priority: 5
    refresh_hours: 6
    timeout_s: 120
    retries: 1
    min_interval_s: 1.0
    url: "https://openagenda.com/agendas/61665301/events.v2.ics?relative[]=upcoming"
    type: ics
    name: "FICEP — instituts culturels étrangers de Paris"
    enabled: true
    license: "ouverte (documentation OpenAgenda)"
    status: ok
    checked: "2026-09-03"
    attribution: "FICEP via OpenAgenda (licence ouverte)"
    home: "https://openagenda.com/agendas/61665301"
    # Vérifié en direct le 03/09/2026 : 149 VEVENT à venir, 149 lignes GEO:,
    # aucune clé API. Sans `relative[]=upcoming`, le même export renvoie
    # l'historique complet (836 VEVENT) — inutile ici.
    note: >-
      Boîte englobante Île-de-France large (marge sur les arrondissements
      limitrophes) — le rayon de recherche de l'API (max 8 km depuis
      Châtelet) fait le tri fin, ce filtre n'écarte que les entrées
      manifestement hors région (Arles, Bruxelles, Lyon vus dans le flux).
    geo_bbox:
      lat_min: 48.60
      lat_max: 49.05
      lon_min: 2.05
      lon_max: 2.65

# --- Pistes Paris intra-muros si un jour QFAP ne suffit plus ----------------
#
# Non sondées : le brief initial visait la banlieue. À tester si besoin :
#   - mairies d'arrondissement (mairie01.paris.fr … mairie20.paris.fr) : ~20 sites
#   - Paris Anim' (réseau des centres d'animation) : programmation par centre
#   - grandes salles : philharmoniedeparis.fr, lagaite-lyrique.net, le104.fr
#   - OpenAgenda : plusieurs agendas parisiens publics, mais l'API exige une clé
#
# Règles inchangées : robots.txt, User-Agent identifiable, ≤ 1 req/s/domaine.

# --- JEDDAH : sources ÉVALUÉES le 06/10/2026, aucune n'est autorisée ----------
# Détail et preuves : docs/jeddah-sources.md. Ces entrées ne sont jamais
# interrogées (`authorization` ≠ ok) ; elles existent pour que la décision soit
# lisible dans le code, et pour qu'une autorisation écrite se traduise par UN
# changement ici (authorization: ok + un connecteur).

  - id: visitsaudi-jeddah
    city: jeddah
    type: jsonld
    url: "https://www.visitsaudi.com/en/jeddah/events"
    name: "Visit Saudi — événements de Jeddah"
    enabled: false
    authorization: refused
    status: bloquée
    checked: "2026-10-06"
    note: >-
      robots.txt autorise les pages, mais les conditions d'utilisation limitent
      la réutilisation à un usage personnel non commercial et interdisent de
      stocker ou reproduire la plateforme sur un autre site sans accord écrit
      préalable. L'API /bin/api/ est disallow. 12 pages d'événements pour Jeddah
      au 06/10/2026, dates sans heure. Accord écrit requis.

  - id: hayyjameel
    city: jeddah
    type: jsonld
    url: "https://hayyjameel.org/whats-on/"
    name: "Hayy Jameel (Art Jameel) — programme"
    enabled: false
    authorization: refused
    status: bloquée
    checked: "2026-10-06"
    note: >-
      Aucun flux ni balisage Event (pages WordPress, dates dans le gabarit). Les
      conditions d'utilisation (Art Jameel L.L.C.) réservent tous les droits sur
      le contenu et exigent une licence écrite pour tout usage non personnel.
      L'API REST de WordPress est fermée (401). Licence écrite requise.

  - id: webook
    city: jeddah
    type: jsonld
    url: "https://webook.com/"
    name: "webook.com — billetterie"
    enabled: false
    authorization: pending
    status: bloquée
    checked: "2026-10-06"
    note: >-
      Application monopage sans balisage Event ni flux ; les données passent par
      api.webook.com, interface privée non documentée. Pas de méthode d'accès
      stable ni autorisée : rien à bricoler. À reconsidérer si webook publie une
      API partenaire.

# --- PARIS : salles évaluées le 06/10/2026 (phase 2.7 / 2.8) -----------------------------------------
# Bataclan : robots.txt autorise tout sauf /pro/ ; mentions légales + CGV lues en entier : AUCUNE clause sur
# la réutilisation du contenu du site (seulement la reproduction des BILLETS) ; chaque page /evenement/…
# publie un JSON-LD schema.org/Event pour les machines. On n'affiche que titre, date, lieu et un lien vers
# la page officielle et la billetterie (jamais d'image ni de description longue — voir pipeline). Coupable
# en une ligne : EVENTMAP_SOURCES_DISABLED=bataclan. Si la salle objecte : la couper, rien d'autre à faire.
  - id: bataclan
    city: paris
    type: jsonld_sitemap
    url: "https://www.bataclan.fr/sitemap.xml"
    name: "Bataclan — programmation"
    enabled: true
    authorization: ok
    priority: 6
    refresh_hours: 24
    timeout_s: 420
    retries: 1
    min_interval_s: 1.5
    attribution: "Bataclan (programmation officielle)"
    home: "https://www.bataclan.fr/programmation"
    status: ok
    checked: "2026-10-06"
    options:
      include: "/evenement/"
      exclude: "_en$"
      date_in_url: '_(\d{4}-\d{2}-\d{2})$'
      max_pages: 150
      tz: "Europe/Paris"
      naive_utc_label: false         # Z = vraie UTC : vérifié le 06/10 — l'en-tête de page affiche l'heure UTC (17h00) alors que
                                     # le déroulé de la même page dit « ouverture des portes 19h00 » (= 17:00Z en heure d'été)
      default_category: music
      venue:
        name: "Bataclan"
        address: "50 boulevard Voltaire, 75011 Paris"
        lat: 48.8631
        lon: 2.3709                  # OSM (node 13100559819) et Base Adresse Nationale concordent

# Écartées (preuves : docs/sources.md) :
#  - CENTQUATRE : pages /fr/programmation/… balisées Event, MAIS mentions légales : « base de données … protégé par
#    le Code de la propriété intellectuelle … toute reproduction, représentation … sans autorisation écrite préalable »
#    → accord écrit requis (action humaine, comme Visit Saudi).
#  - La Cigale : robots.txt Crawl-delay 3 et `Disallow: /*?` ; aucune page événement balisée Event.
#  - Rond-Point, Odéon : aucun JSON-LD Event trouvé (pages d'archive / saison seulement).
#  - Chaillot : site injoignable depuis ce poste le 06/10/2026.

# --- OpenAgenda (phase 2.5) : voie propre via le jeu Opendatasoft « Public events - OpenAgenda » -------
# L'API d'OpenAgenda exige une clé (403 sans). Ce jeu rediffuse les agendas publics en open data, sous
# Licence Ouverte v1.0 (Etalab : réutilisation libre avec mention de la source), API Explore v2.1 sans clé.
# 1 356 événements parisiens à venir le 06/10/2026, coordonnées + créneaux réels (`timings`).
# Contient aussi FICEP : le dédoublonnage inter-sources ramène à un seul événement ceux que QFAP/FICEP publient.
  - id: openagenda-idf
    city: paris
    type: ods_openagenda
    url: "https://public.opendatasoft.com/explore/dataset/evenements-publics-openagenda/"
    name: "OpenAgenda — événements publics (Paris)"
    enabled: true
    authorization: ok
    priority: 4
    refresh_hours: 12
    timeout_s: 300
    retries: 1
    min_interval_s: 1.0
    attribution: "OpenAgenda — événements publics (Licence Ouverte v1.0)"
    home: "https://public.opendatasoft.com/explore/dataset/evenements-publics-openagenda/"
    license: "Licence Ouverte v1.0 (Etalab)"
    status: ok
    checked: "2026-10-06"
    options:
      host: public.opendatasoft.com
      dataset: evenements-publics-openagenda
      where: 'location_city="Paris" AND lastdate_end >= now()'
