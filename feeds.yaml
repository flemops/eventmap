    city: Montreuil
    type: openagenda
    enabled: false
    license: unknown
    status: needs-key
    checked: 2026-08-23
    note: >
      Agenda OpenAgenda uid 14898606. 1 seul événement visible au sondage.
      L'API exige une clé (403 sans) : activer avec OPENAGENDA_KEY et
      url: https://api.openagenda.com/v2/agendas/14898606 si le volume
      le justifie un jour.

