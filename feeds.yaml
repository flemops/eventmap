# Annuaire des sources de la couche 2 (flux municipaux, salles, lieux).
#
# PÉRIMÈTRE : PARIS INTRA-MUROS. QFAP reste la source de base (voir main.py,
# _build_fetchers) ; ce fichier ajoute des flux ICS/OpenAgenda complémentaires.
#
# Champs lus par le code (main.py::_build_fetchers) :
#   url       : ce que le connecteur charge — clé d'upsert dans `feeds`
#   type      : ics | rss | jsonld | openagenda | llm (seuls ics/openagenda
#               sont câblés dans la boucle de refresh)
#   name      : libellé humain, stocké en base
#   enabled   : false = ignoré par la boucle de refresh (défaut : true)
#   geo_bbox  : optionnel — {lat_min, lat_max, lon_min, lon_max}. Un flux qui
#               déborde de son périmètre déclaré (ex. FICEP : quelques
#               entrées à Arles, Bruxelles, Lyon) est filtré à l'ingestion
#               plutôt que d'être cru sur parole.
#
# Champs documentaires seulement (ignorés par le code, gardés pour mémoire) :
#   license, status, checked, note, attribution

feeds:
  - url: "https://openagenda.com/agendas/61665301/events.v2.ics?relative[]=upcoming"
    type: ics
    name: "FICEP — instituts culturels étrangers de Paris"
    enabled: true
    license: "ouverte (documentation OpenAgenda)"
    status: ok
    checked: "2026-09-03"
    attribution: "FICEP via OpenAgenda — licence ouverte"
    # Vérifié en direct le 03/09/2026 : 149 VEVENT à venir, 149 lignes GEO:,
    # aucune clé API. Sans `relative[]=upcoming`, le même export renvoie
    # l'historique complet (836 VEVENT) — inutile ici.
    note: >-
      Boîte englobante Île-de-France large (marge sur les arrondissements
      limitrophes) — le rayon de recherche de l'API (max 8 km depuis
      Châtelet) fait le tri fin, ce filtre n'écarte que les entrées
      manifestement hors région (Arles, Bruxelles, Lyon vus dans le flux).
    geo_bbox:
      lat_min: 48.60
      lat_max: 49.05
      lon_min: 2.05
      lon_max: 2.65

# --- Pistes Paris intra-muros si un jour QFAP ne suffit plus ----------------
#
# Non sondées : le brief initial visait la banlieue. À tester si besoin :
#   - mairies d'arrondissement (mairie01.paris.fr … mairie20.paris.fr) : ~20 sites
#   - Paris Anim' (réseau des centres d'animation) : programmation par centre
#   - grandes salles : philharmoniedeparis.fr, lagaite-lyrique.net, le104.fr
#   - OpenAgenda : plusieurs agendas parisiens publics, mais l'API exige une clé
#
# Règles inchangées : robots.txt, User-Agent identifiable, ≤ 1 req/s/domaine.
