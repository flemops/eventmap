# Annuaire des sources de la couche 2 (flux municipaux, salles, lieux).
#
# PÉRIMÈTRE ACTUEL : PARIS INTRA-MUROS, SOURCE UNIQUE = QUE FAIRE À PARIS.
# Ce fichier est volontairement vide de flux actifs. La boucle de refresh ne
# charge que le connecteur QFAP (voir main.py, _build_fetchers).
#
# Il reste versionné parce que le sondage du 23/08 a une valeur : il documente
# ce qui existe (ou pas) chez les sources de banlieue, au cas où le périmètre
# s'élargirait un jour. Le détail complet est archivé dans docs/sources.md,
# section « Sondage banlieue ».
#
# Champs :
#   url       : ce que le connecteur charge
#   type      : ics | rss | jsonld | openagenda | llm
#   enabled   : false = ignoré par la boucle de refresh
#   license   : licence constatée, ou unknown
#   status    : ok | empty | no-feed | dns-error | cert-expired | needs-key
#   checked   : date du dernier sondage
#   note      : ce qu'il faut savoir

feeds: []

