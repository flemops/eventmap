# Référentiel des lieux de Jeddah — un lieu = UN objet, quelle que soit la façon
# dont une source l'écrit (arabe, anglais, translittération, avec ou sans
# l'article « ال »).
#
# Règles
#   - Coordonnées : seulement celles d'une source vérifiable. Ici,
#     OpenStreetMap (licence ODbL), interrogé le 06/10/2026 ; l'identifiant OSM
#     est conservé dans `osm` pour que chacun puisse vérifier. Un lieu dont on
#     ne connaît pas les coordonnées N'EST PAS inscrit (Hayy Jameel et le Red
#     Sea Museum sont introuvables dans OSM par leur nom au 06/10/2026 : ils
#     entreront avec les coordonnées de leur première source autorisée).
#   - `aliases` : toute autre écriture rencontrée dans une source. La
#     comparaison ignore casse, accents, voyelles brèves, ponctuation et variantes
#     d'alef (voir textnorm.norm_key) : inutile de lister « Al-Balad » ET
#     « al balad ».
#   - Un alias ne doit désigner qu'UN lieu (vérifié par un test).
#
# Ce fichier ne contient AUCUN événement.

